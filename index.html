<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearTrack - Equipment Loans</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <header class="app-header">
        <h1>GearTrack Department Manager</h1>
    </header>

    <main class="dashboard">
        <section class="panel">
            <h2>Available Equipment</h2>

            <form id="categoryForm" class="cat-form">
                <div class="form-group">
                    <label>
                        item:
                        <input type="search" id="item-name" name="item" placeholder="name or id...">
                    </label>
                </div>
                <div class="form-group">
                    <label>
                            Category:
                            <select id="category-filtering" name="category"></select>
                    </label>
                </div>               
                

                <div class="form-controls"><button type="submit" class="btn">Search</button></div>
            </form>

            <ul id="equipment-list" class="item-list"></ul>
        </section>

        <section class="panel">
            <h2>Active Loans</h2>
            <div id="summary-pill"></div>
            <div id="active-loans-list" class="item-list"></div>
        </section>
    </main>
    <dialog id="checkout-dialog" class="modal" aria-labelledby="">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="contactModalTitle">Loan Equipment form</h2>
                <button commandfor="checkout-dialog" command="close" type="button" class="modal-close" data-modal-close>
                    <span>&times;</span>
                </button>
            </div>
            <form method="dialog" id="checkoutForm" class="checkout-form">
                <input type="hidden" name="equipmentId" id="checkout-item-id">
                <div class="form-group">
                    <label for="borrowerName">
                        Borrower Name:
                        <input type="text" name="borrowerName" id="borrowerName" required>
                    </label>
                </div>
                <div class="form-group">
                    <label>
                        Borrower Email:
                        <input type="text" name="borrowerEmail" id="borrowerEmail" required>
                    </label>
                </div>
                <div class="form-group">
                    <label>
                        Return Date:
                        <input type="date" name="dueDate" id="dueDate" required>                
                    </label>
                </div>         

                <div class="modal-controls">
                    <button commandfor="checkout-dialog" command="close" type="button" class="btn btn-outline">Cancel</button>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </div>

            </form>
        </div>
    </dialog>

    <script type="module" src="js/app.js"></script>
</body>

</html>
