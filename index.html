<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearTrack - Equipment Loans</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <header class="app-header">
        <h1>GearTrack Department Manager</h1>
    </header>

    <main class="dashboard">
        <section class="panel">
            <h2>Available Equipment</h2>
            <ul id="equipment-list" class="item-list"></ul>
        </section>

        <section class="panel">
            <h2>Active Loans</h2>
            <div id="active-loans-list" class="item-list"></div>
        </section>
    </main>
    <dialog id="checkout-dialog">
        <form action="" method="dialog" id="checkout-form">
            <label>
                Borrower Name:
                <input type="text" name="borrowerName" id="borrowerName">
            </label>
            <label>
                Borrower Email:
                <input type="text" name="borrowerEmail" id="borrowerEmail">
            </label>
            <label>
                Return Date:
                <input type="date" name="dueDate" id="dueDate">                
            </label>
            
            <input type="submit" value="submit">

            <input type="hidden" name="equipmentId" id="checkout-item-id">
        </form>
        <button commandfor="checkout-dialog" command="close">Close</button>
    </dialog>

    <script type="module" src="js/app.js"></script>
</body>

</html>
